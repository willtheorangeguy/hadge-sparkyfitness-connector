services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: sparkyfitness
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: synthetic-e2e-database-password
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sparky -d sparkyfitness']
      interval: 3s
      timeout: 5s
      retries: 40
  server:
    # Same pinned Sparky v1.8.0 image as the local Sparky addon harness.
    image: codewithcj/sparkyfitness_server@sha256:001f173ef46aeb40882516a5f14db73180517b051a82e551c98db48b9263d9e6
    environment:
      SPARKY_FITNESS_DB_HOST: db
      SPARKY_FITNESS_DB_PORT: '5432'
      SPARKY_FITNESS_DB_NAME: sparkyfitness
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: synthetic-e2e-database-password
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: synthetic-e2e-app-password
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:3010
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: http://localhost:3010
      SPARKY_FITNESS_API_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      BETTER_AUTH_SECRET: synthetic-e2e-auth-secret-for-isolated-testing-only
      SPARKY_FITNESS_SERVER_PORT: '3010'
      SPARKY_FITNESS_DISABLE_SIGNUP: 'false'
      SPARKY_FITNESS_DISABLE_SCHEDULED_JOBS: 'true'
      SPARKY_FITNESS_API_KEY_RATELIMIT_MAX_REQUESTS: '10000'
      SPARKY_FITNESS_LOG_LEVEL: INFO
      NODE_ENV: production
      TZ: UTC
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 10s
      start_period: 90s
      retries: 60
  fixtures:
    image: hadge-sparkyfitness-connector:e2e
    network_mode: service:server
    entrypoint: [python, /e2e/mock_services.py]
    volumes: [./:/e2e:ro]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/__health')"]
      interval: 2s
      timeout: 5s
      retries: 20
  runner:
    image: hadge-sparkyfitness-connector:e2e
    build:
      context: ../..
    profiles: [tools]
    network_mode: service:server
    entrypoint: [python, /e2e/scenarios.py]
    volumes:
      - ./:/e2e:ro
      - ../../reports/e2e:/reports
      - connector-state:/state
    depends_on:
      fixtures: {condition: service_healthy}
volumes:
  database:
  connector-state:
