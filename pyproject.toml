[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hadge-sparkyfitness-connector"
version = "0.1.0"
description = "Sync Hadge workout summaries into Sparky Fitness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["requests>=2.32.5,<3", "filelock>=3.20,<4", "tzdata>=2025.2,<2027"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1"]

[project.scripts]
hadge-sparkyfitness-connector = "hadge_sparkyfitness_connector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
